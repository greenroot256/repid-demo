<svg width="1600" height="1420" viewBox="0 0 1600 1420" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', Arial, sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      .serif { font-family: 'Fraunces', Georgia, serif; }
      .sans  { font-family: 'IBM Plex Sans', Arial, sans-serif; }
      .mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .section-label { font-size: 14px; font-weight: 500; }
      .box-title-dark  { font-size: 17px; font-weight: 600; fill: #1a1a17; }
      .box-title-light { font-size: 17px; font-weight: 600; fill: #ede9dd; }
      .box-sub-dark  { font-size: 12.5px; fill: #6b6a5f; }
      .box-sub-light { font-size: 12.5px; fill: #a9b8ad; }
    </style>
    <marker id="arrowSignal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8863b" />
    </marker>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b7a5a" />
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="1420" fill="#f4f2ea" />

  <!-- header -->
  <text x="60" y="55" class="serif" font-size="40" font-weight="600" fill="#1a1a17">RepID</text>
  <text x="60" y="82" class="sans" font-size="15" fill="#6b6a5f">Protocol architecture — facts live on-chain, meaning is built afterward</text>
  <line x1="60" y1="100" x2="1540" y2="100" stroke="#e4e0d2" stroke-width="1.5" />

  <!-- ============ OFF-CHAIN ============ -->
  <rect x="0" y="100" width="1600" height="230" fill="#efead9" />
  <text x="60" y="130" class="sans section-label" fill="#6b6a5f">Off-chain — interpretation</text>

  <!-- box: application interaction -->
  <rect x="150" y="170" width="460" height="140" rx="6" fill="none" stroke="#b8ac8e" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="176" y="205" class="sans box-title-dark">Application interaction</text>
  <text x="176" y="230" class="sans box-sub-dark">RFC-002 — each app's own event</text>
  <text x="176" y="248" class="sans box-sub-dark">(a purchase, a service, a message)</text>
  <text x="176" y="278" class="sans box-sub-dark" font-style="italic">↓ anchored on-chain as a Receipt Genesis</text>

  <!-- box: scores and reputation -->
  <rect x="990" y="170" width="460" height="140" rx="6" fill="none" stroke="#b8ac8e" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="1016" y="205" class="sans box-title-dark">Scores and reputation</text>
  <text x="1016" y="230" class="sans box-sub-dark">how each rating is weighted</text>
  <text x="1016" y="248" class="sans box-sub-dark">each app's decision, not the protocol's</text>
  <text x="1016" y="278" class="sans box-sub-dark" font-style="italic">↑ fed by the recognized facts</text>

  <!-- ============ INDEXER ============ -->
  <rect x="0" y="330" width="1600" height="90" fill="#b8863b1a" />
  <line x1="0" y1="330" x2="1600" y2="330" stroke="#b8863b" stroke-width="1.5" />
  <line x1="0" y1="420" x2="1600" y2="420" stroke="#b8863b" stroke-width="1.5" />
  <text x="170" y="368" class="sans" font-size="15" font-weight="600" fill="#8a5f24">Recognizer — RFC-006 · @repid/sdk (its own repository)</text>
  <text x="170" y="390" class="mono" font-size="12.5" fill="#8a5f24">decodeTransactionBCH → structured facts · constants and schema read from repid-protocol</text>
  <text x="170" y="408" class="mono" font-size="12.5" fill="#8a5f24">retained state: Rating Rights, receipts, identity vaults (in memory or a JSON file)</text>

  <!-- vertical data flow: on-chain -> indexer -> interpretation -->
  <line x1="800" y1="420" x2="800" y2="160" stroke="#8b7a5a" stroke-width="2" marker-end="url(#arrowFlow)" />

  <!-- ============ ON-CHAIN ============ -->
  <rect x="40" y="420" width="1520" height="700" rx="10" fill="#14231c" />
  <text x="80" y="458" class="sans section-label" fill="#a9b8ad">On-chain — immutable facts (Bitcoin Cash)</text>

  <!-- row 1: identity genesis (RFC-001) -->
  <rect x="310" y="480" width="280" height="85" rx="5" fill="#1b2e24" stroke="#2c4536" stroke-width="1.5" />
  <circle cx="332" cy="502" r="5" fill="#b8863b" />
  <text x="348" y="507" class="sans box-title-light">Identity A</text>
  <text x="332" y="530" class="sans box-sub-light">RFC-001 — immutable NFT in a covenant</text>
  <text x="332" y="548" class="sans box-sub-light">IdentityVault + BCH collateral (never decreases)</text>

  <rect x="1010" y="480" width="280" height="85" rx="5" fill="#1b2e24" stroke="#2c4536" stroke-width="1.5" />
  <circle cx="1032" cy="502" r="5" fill="#b8863b" />
  <text x="1048" y="507" class="sans box-title-light">Identity B</text>
  <text x="1032" y="530" class="sans box-sub-light">RFC-001 — immutable NFT in a covenant</text>
  <text x="1032" y="548" class="sans box-sub-light">IdentityVault + BCH collateral (never decreases)</text>

  <!-- row 2: receipt genesis (RFC-003/004) -->
  <rect x="610" y="615" width="380" height="95" rx="5" fill="#1b2e24" stroke="#b8863b" stroke-width="1.75" />
  <circle cx="634" cy="638" r="5" fill="#6b7fb8" />
  <text x="650" y="643" class="sans box-title-light">Receipt Genesis</text>
  <text x="634" y="666" class="sans box-sub-light">RFC-003/004 — joint A + B signature</text>
  <text x="634" y="684" class="sans box-sub-light">mints 4 outputs in a single tx</text>

  <line x1="450" y1="565" x2="655" y2="615" stroke="#b8863b" stroke-width="1.75" marker-end="url(#arrowSignal)" />
  <line x1="1150" y1="565" x2="945" y2="615" stroke="#b8863b" stroke-width="1.75" marker-end="url(#arrowSignal)" />

  <!-- row 3: the genesis outputs -->
  <rect x="310" y="760" width="280" height="85" rx="5" fill="#1b2e24" stroke="#2c4536" stroke-width="1.5" />
  <circle cx="332" cy="782" r="5" fill="none" stroke="#6b7fb8" stroke-width="2" />
  <text x="348" y="787" class="sans box-title-light">Rating Right A</text>
  <text x="332" y="810" class="sans box-sub-light">commitment = pkh(B)</text>
  <text x="332" y="828" class="sans box-sub-light">locked to A's P2PKH</text>

  <rect x="660" y="760" width="280" height="85" rx="5" fill="#1b2e24" stroke="#6b7fb8" stroke-width="1.75" />
  <circle cx="682" cy="782" r="5" fill="#6b7fb8" />
  <text x="698" y="787" class="sans box-title-light">Interaction Receipt</text>
  <text x="682" y="810" class="sans box-sub-light">Immutable NFT, anchors the fact</text>
  <text x="682" y="828" class="sans box-sub-light" font-style="italic">locked to A's P2PKH (covenant rule)</text>

  <rect x="1010" y="760" width="280" height="85" rx="5" fill="#1b2e24" stroke="#2c4536" stroke-width="1.5" />
  <circle cx="1032" cy="782" r="5" fill="none" stroke="#6b7fb8" stroke-width="2" />
  <text x="1048" y="787" class="sans box-title-light">Rating Right B</text>
  <text x="1032" y="810" class="sans box-sub-light">commitment = pkh(A)</text>
  <text x="1032" y="828" class="sans box-sub-light">locked to B's P2PKH</text>

  <line x1="800" y1="710" x2="450" y2="760" stroke="#b8863b" stroke-width="1.5" marker-end="url(#arrowSignal)" />
  <line x1="800" y1="710" x2="800" y2="760" stroke="#b8863b" stroke-width="1.5" marker-end="url(#arrowSignal)" />
  <line x1="800" y1="710" x2="1150" y2="760" stroke="#b8863b" stroke-width="1.5" marker-end="url(#arrowSignal)" />

  <text x="450" y="990" text-anchor="middle" class="sans box-sub-light" font-style="italic" fill="#7d8c81">the 4 outputs = Receipt + 2 Rating Rights + change to A (fees)</text>

  <!-- row 5: platform confirmation + trust link -->
  <rect x="310" y="998" width="280" height="88" rx="5" fill="#1b2e24" stroke="#a6a0c8" stroke-width="1.75" />
  <circle cx="332" cy="1020" r="5" fill="#a6a0c8" />
  <text x="348" y="1025" class="sans box-title-light">Platform Confirmation</text>
  <text x="332" y="1048" class="sans box-sub-light">SPEC-003 RF-06 — the app spends its own UTXO</text>
  <text x="332" y="1066" class="sans box-sub-light">with OP_RETURN → the Receipt's txid.</text>
  <text x="332" y="1080" class="sans box-sub-light" font-style="italic">no identity of its own required</text>

  <rect x="1010" y="998" width="280" height="88" rx="5" fill="#1b2e24" stroke="#b8863b" stroke-width="1.75" />
  <circle cx="1032" cy="1020" r="5" fill="#b8863b" />
  <text x="1048" y="1025" class="sans box-title-light">Trust Link</text>
  <text x="1032" y="1048" class="sans box-sub-light">SPEC-006 — P2PKH spend + OP_RETURN</text>
  <text x="1032" y="1066" class="sans box-sub-light">with B's pkh: a unilateral declaration</text>
  <text x="1032" y="1080" class="sans box-sub-light" font-style="italic">of trust (self-trust → INVALID)</text>

  <!-- the confirmation references the receipt -->
  <line x1="800" y1="845" x2="450" y2="998" stroke="#a6a0c8" stroke-width="1.5" marker-end="url(#arrowFlow)" />

  <text x="80" y="1140" class="mono" font-size="12" fill="#7d8c81">Reference implementation — CashScript covenants: IdentityVault (collateral covenant), IdentityGenesisValidator (legacy), ReceiptGenesisValidator (RFC-005) · Mock and Chipnet modes (real tBCH network)</text>

  <!-- row 4: ISSUED_RATING (RFC-004) -->
  <rect x="310" y="895" width="280" height="85" rx="5" fill="#1b2e24" stroke="#4f7942" stroke-width="1.75" />
  <circle cx="332" cy="917" r="5" fill="#4f7942" />
  <text x="348" y="922" class="sans box-title-light">Issued Rating A → B</text>
  <text x="332" y="945" class="sans box-sub-light">plain P2PKH spend + OP_RETURN</text>
  <text x="332" y="963" class="sans box-sub-light">the NFT burns (never reappears)</text>

  <rect x="1010" y="895" width="280" height="85" rx="5" fill="#1b2e24" stroke="#4f7942" stroke-width="1.75" />
  <circle cx="1032" cy="917" r="5" fill="#4f7942" />
  <text x="1048" y="922" class="sans box-title-light">Issued Rating B → A</text>
  <text x="1032" y="945" class="sans box-sub-light">plain P2PKH spend + OP_RETURN</text>
  <text x="1032" y="963" class="sans box-sub-light">the NFT burns (never reappears)</text>

  <line x1="450" y1="845" x2="450" y2="895" stroke="#4f7942" stroke-width="1.5" marker-end="url(#arrowSignal)" />
  <line x1="1150" y1="845" x2="1150" y2="895" stroke="#4f7942" stroke-width="1.5" marker-end="url(#arrowSignal)" />

  <text x="80" y="1020" class="mono" font-size="12" fill="#7d8c81">Reference implementation — CashScript covenants: IdentityVault, IdentityGenesisValidator (legacy), ReceiptGenesisValidator (RFC-005)</text>

  <!-- ============ LEGEND AND CLOSING ============ -->
  <g transform="translate(0,1280)">
    <circle cx="175" cy="0" r="5" fill="#b8863b" />
    <text x="190" y="4" class="sans" font-size="12.5" fill="#6b6a5f">Identity (RFC-001)</text>

    <circle cx="420" cy="0" r="5" fill="#6b7fb8" />
    <text x="435" y="4" class="sans" font-size="12.5" fill="#6b6a5f">Receipt / Rating Right (RFC-003/004)</text>

    <circle cx="720" cy="0" r="5" fill="none" stroke="#6b7fb8" stroke-width="2" />
    <text x="735" y="4" class="sans" font-size="12.5" fill="#6b6a5f">Unspent Rating Right</text>

    <circle cx="950" cy="0" r="5" fill="#4f7942" />
    <text x="965" y="4" class="sans" font-size="12.5" fill="#6b6a5f">Issued rating (RFC-004)</text>
  </g>

  <text x="800" y="1340" text-anchor="middle" class="serif" font-size="18" font-style="italic" fill="#4a463c">
    The protocol records facts. Meaning is built afterward, off-chain.
  </text>
  <text x="60" y="1400" class="sans" font-size="12" fill="#9a9585">RFC-001 to RFC-006 · updated diagram (collateral covenant, platform confirmation, trust link, change to A)</text>
</svg>